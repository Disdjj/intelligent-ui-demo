<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Intelligent UI · Replica</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%230d0d0d'/><path d='M10 21V11l6 4 6-4v10' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <link rel="stylesheet" href="/dil/dil.css" />
    <link rel="stylesheet" href="/app/app.css" />
  </head>
  <body class="dil-root">
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17V7l6 4 6-4v10"/></svg>
          </span>
          <span class="brand-name">Intelligent UI</span>
          <span class="brand-sub">Replica</span>
        </div>
        <div class="topbar-actions">
          <span class="model-chip" id="model-chip" title="当前 agent">连接中…</span>
          <button class="icon-button" id="new-chat" type="button" title="新对话" aria-label="新对话">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <button class="icon-button" id="dev-toggle" type="button" title="开发者面板" aria-label="开发者面板" aria-pressed="false">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg>
          </button>
        </div>
      </header>

      <main class="main" id="main">
        <section class="empty" id="empty">
          <h1>想要什么样的界面？</h1>
          <p>描述一个可交互的界面，模型会边写边渲染。生成后可以继续操作，下一轮对话会带上你在界面上的选择。</p>
          <div class="suggestions" id="suggestions">
            <button type="button" data-prompt="做一个房贷计算器：可调贷款金额、年限、利率，显示月供，并用柱状图对比等额本息和等额本金的总利息">
              <b>房贷计算器</b><span>滑块调参 · 柱状图对比</span>
            </button>
            <button type="button" data-prompt="做一个番茄钟：可选专注时长（15/25/50 分钟），可勾选今天完成的任务，并用饼图显示完成与未完成的比例">
              <b>番茄钟</b><span>任务勾选 · 饼图进度</span>
            </button>
            <button type="button" data-prompt="做一个旅行预算规划器：选择目的地和天数，分项填写交通、住宿、餐饮预算，显示总额和每日花费趋势">
              <b>旅行预算</b><span>分项输入 · 折线趋势</span>
            </button>
            <button type="button" data-source="captured" data-prompt="回放：ChatGPT 抓包中的计费控制台">
              <b>回放 ChatGPT 原版</b><span>抓包源码 · 不调用模型</span>
            </button>
          </div>
        </section>
        <div class="thread" id="thread"></div>
      </main>

      <footer class="composer-wrap">
        <form class="composer" id="composer">
          <textarea id="prompt" rows="1" placeholder="描述你想要的可交互界面…" autocomplete="off"></textarea>
          <button type="submit" class="send" id="send" aria-label="发送">
            <svg class="icon-send" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
            <svg class="icon-stop" viewBox="0 0 24 24" width="14" height="14"><rect x="5" y="5" width="14" height="14" rx="2.5" fill="currentColor"/></svg>
          </button>
        </form>
        <p class="composer-hint" id="hint">模型只输出 DIL 源码，编译、沙箱执行和渲染都在本地完成。</p>
      </footer>
    </div>

    <aside class="devpanel" id="devpanel" hidden>
      <header class="devpanel-head">
        <nav class="devpanel-tabs" id="dev-tabs"></nav>
        <button class="icon-button" id="dev-close" type="button" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </header>
      <div class="devpanel-meta" id="dev-meta"></div>
      <pre class="devpanel-body" id="dev-body"></pre>
    </aside>

    <script type="module" src="/app/main.js"></script>
  </body>
</html>
